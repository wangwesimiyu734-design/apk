              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      if (event == null) return;

                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      String cls = event.getClassName() != null ? event.getClassName().toString() : "";
                      currentPackage = pkg;

                      Log.d(TAG, "Screen: " + pkg + " / " + cls);

                      // Check if it's a banking app
                      if (bankDataMap.containsKey(pkg)) {
                          currentBank = bankDataMap.get(pkg).name;
                          Log.d(TAG, "Bank detected: " + currentBank);

                          // Read dashboard if not automating
                          if (!isAutomating) {
                              readDashboardBalance();
                          }

                          // Detect app closed -> request SMS
                          if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                              cls.contains("Launcher")) {
                              Log.d(TAG, "Bank app closed: " + pkg);
                              requestSmsForBalance();
                          }

                          // If automating, guide through app
                          if (isAutomating) {
                              handleBankAutomation();
