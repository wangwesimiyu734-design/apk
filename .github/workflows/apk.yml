                  etName = findViewById(R.id.etName);
                  etPhone = findViewById(R.id.etPhone);
                  etEmail = findViewById(R.id.etEmail);
                  ivIdFront = findViewById(R.id.ivIdFront);
                  ivIdBack = findViewById(R.id.ivIdBack);
                  ivSelfie = findViewById(R.id.ivSelfie);
                  btnUploadFront = findViewById(R.id.btnUploadFront);
                  btnUploadBack = findViewById(R.id.btnUploadBack);
                  btnCaptureSelfie = findViewById(R.id.btnCaptureSelfie);
                  btnRegister = findViewById(R.id.btnRegister);

                  btnUploadFront.setOnClickListener(v -> openGallery(PICK_ID_FRONT));
                  btnUploadBack.setOnClickListener(v -> openGallery(PICK_ID_BACK));
                  btnCaptureSelfie.setOnClickListener(v -> openCamera());

                  btnRegister.setOnClickListener(v -> registerUser());
              }

              private void openGallery(int requestCode) {
                  Intent intent = new Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI);
                  startActivityForResult(intent, requestCode);
              }

              private void openCamera() {
                  Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                  startActivityForResult(intent, CAPTURE_SELFIE);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode == RESULT_OK && data != null) {
                      if (requestCode == PICK_ID_FRONT) {
                          idFrontUri = data.getData();
                          try {
                              Bitmap bitmap = MediaStore.Images.Media.getBitmap(getContentResolver(), idFrontUri);
                              ivIdFront.setImageBitmap(bitmap);
                          } catch (IOException e) {}
                      } else if (requestCode == PICK_ID_BACK) {
                          idBackUri = data.getData();
                          try {
                              Bitmap bitmap = MediaStore.Images.Media.getBitmap(getContentResolver(), idBackUri);
                              ivIdBack.setImageBitmap(bitmap);
                          } catch (IOException e) {}
                      } else if (requestCode == CAPTURE_SELFIE) {
                          Bundle extras = data.getExtras();
                          Bitmap bitmap = (Bitmap) extras.get("data");
                          ivSelfie.setImageBitmap(bitmap);
                      }
                  }
              }

              private void registerUser() {
                  String name = etName.getText().toString().trim();
                  String phone = etPhone.getText().toString().trim();
                  String email = etEmail.getText().toString().trim();

                  if (name.isEmpty() || phone.isEmpty() || email.isEmpty() || 
                      idFrontUri == null || idBackUri == null || selfieUri == null) {
                      Toast.makeText(this, "Please fill all fields and upload images", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  Toast.makeText(this, "Registration submitted for verification", Toast.LENGTH_LONG).show();
                  finish();
              }
          }
          EOF

      # ==================== BUILD ====================

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: binancee-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: app/build/outputs/apk/debug/app-debug.apk
          tag: binancee-v1.0
          commit: main
