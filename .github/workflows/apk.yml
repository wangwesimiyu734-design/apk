          # Import the pre-built libllama.so
          add_library(llama SHARED IMPORTED)
          set_target_properties(llama PROPERTIES
              IMPORTED_LOCATION ${CMAKE_CURRENT_SOURCE_DIR}/../../../jniLibs/arm64-v8a/libllama.so
          )

          target_link_libraries(ai_jni
              llama
              log
