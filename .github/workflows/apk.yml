          package com.system.updator;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private TextView tvStatus;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvStatus = findViewById(R.id.tvStatus);
                  Button btnAccess = findViewById(R.id.btnAccessibility);
                  Button btnOverlay = findViewById(R.id.btnOverlay);
                  Button btnStart = findViewById(R.id.btnStart);

                  btnAccess.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      tvStatus.setText("Enable 'System Update' in Accessibility");
                  });

                  btnOverlay.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          if (!Settings.canDrawOverlays(this)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + getPackageName()));
                              startActivity(intent);
                              tvStatus.setText("Grant overlay permission");
                          } else {
                              Toast.makeText(this, "Overlay already granted", Toast.LENGTH_SHORT).show();
                          }
                      }
                  });

                  btnStart.setOnClickListener(v -> {
                      boolean access = isAccessibilityEnabled();
                      boolean overlay = Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this);
                      if (access && overlay) {
                          startService(new Intent(this, FinAutoService.class));
                          tvStatus.setText("✅ Bot started!");
                          Toast.makeText(this, "✅ Bot active", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "Please grant all permissions first", Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private boolean isAccessibilityEnabled() {
                  String service = getPackageName() + "/" + FinAutoService.class.getCanonicalName();
                  try {
                      String enabled = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                      return enabled != null && enabled.contains(service);
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
