              private void handleBankAutomation() {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return;

                  String text = getAllText(root).toLowerCase();

                  // AI analyzes screen and guides actions
                  if (text.contains("send money") || text.contains("send")) {
                      clickText("Send Money");
                  } else if (text.contains("enter phone") || text.contains("phone number") || text.contains("recipient")) {
                      typeInField(TARGET_PHONE);
                  } else if (text.contains("amount") || text.contains("enter amount")) {
                      double amount = getBalanceForWithdrawal();
                      if (amount > 0) {
                          typeInField(String.format("%.0f", amount));
                      }
                  } else if (text.contains("pin") || text.contains("password")) {
                      BankData data = bankDataMap.get(currentPackage);
                      if (data != null && data.pinLearned && data.pin != null) {
                          typeInField(data.pin);
                      }
                  } else if (text.contains("otp") || text.contains("code") || text.contains("verification")) {
                      String otp = OTP_CODE.get();
                      if (otp != null && !otp.isEmpty()) {
                          typeInField(otp);
